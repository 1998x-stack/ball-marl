[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ball-marl"
version = "0.1.0"
description = "Reproducible ball-consumption multi-agent reinforcement learning research sandbox"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1", "PyYAML>=6"]
[project.optional-dependencies]
pettingzoo = ["gymnasium>=1.0", "pettingzoo>=1.24"]
test = ["pytest>=8"]
[project.scripts]
ball-marl = "training.cli:main"
[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "environments*", "observations*", "actions*", "rewards*", "algorithms*", "credit_assignment*", "league*", "evaluation*", "training*", "specifications*"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
specifications = ["*.yaml"]
